spring:
  datasource:
    url: jdbc:h2:file:./data/lastdance-dev;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create   # 개발 중에는 update 편함 (엔티티 변경 시 테이블 자동 반영)
    properties:
      hibernate:
        format_sql: true
        show_sql: true   # 콘솔에 SQL 찍어보기

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
